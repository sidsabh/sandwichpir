[package]
name = "pir-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["wasm-bindgen", "js-sys", "web-sys", "getrandom/js"]
native = ["clap", "env_logger"]
default = []

[dependencies]
spiral-rs = { git = "https://github.com/menonsamir/spiral-rs.git", branch = "avoid-avx512" }
rand = { version = "0.8.5", features = ["small_rng"] }
rand_chacha = "0.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
getrandom = { version = "0.2" }

# WASM-only deps
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }

# Native CLI deps (no heavy HTTP client — use raw TcpStream)
clap = { version = ">=4.5.0, <4.6.0", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }

[[bin]]
name = "pir-query"
path = "src/bin/query.rs"
required-features = ["native"]

[profile.release]
opt-level = "s"
lto = true
