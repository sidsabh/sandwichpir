[workspace]
members = [".", "pir_client", "pir_server", "wikipedia/server"]
# Note: the vendored baseline crates under rodeo/schemes/ are kept out of this
# workspace by an empty [workspace] table in each of their own manifests
# (rodeo/patches/05, 06). Listing them in `exclude` here does not work under the
# cargo 1.78 their rust-toolchain.toml pins.

[package]
name = "sandwichpir"
version = "0.1.0"
edition = "2021"
default-run = "run"
autobenches = false

[features]
cuda = []
default = []

[build-dependencies]
cc = "1.0"

[dependencies]
spiral-rs = { git = "https://github.com/menonsamir/spiral-rs.git", branch = "avoid-avx512" }
rand = { version = "0.8.5", features = ["small_rng"] }
rand_chacha = "0.3.1"
serde_json = "1.0"
serde = { version = "1.0.160", features = ["derive"] }
fastrand = "2.0.0"
log = "0.4.20"
env_logger = "0.11.1"
clap = { version = "4.5.0", features = ["derive"] }
test-log = "0.2.14"
brotli = "6.0"

[profile.release]
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.test]
opt-level = 3

[[bin]]
name = "run"
path = "src/bin/run.rs"

[[bin]]
name = "brotli_bench"
path = "benches/brotli_bench.rs"
